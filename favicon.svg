<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo circular -->
  <circle cx="16" cy="16" r="15" fill="#534AB7"/>
  <!-- Cara del reloj -->
  <circle cx="16" cy="16" r="11" fill="white"/>
  <!-- Marcas de horas -->
  <line x1="16" y1="6" x2="16" y2="8.5" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="16" x2="23.5" y2="16" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="26" x2="16" y2="23.5" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6" y1="16" x2="8.5" y2="16" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Manecilla de horas (apuntando a las 10) -->
  <line x1="16" y1="16" x2="11.5" y2="11.5" stroke="#534AB7" stroke-width="2" stroke-linecap="round"/>
  <!-- Manecilla de minutos (apuntando a las 2) -->
  <line x1="16" y1="16" x2="20" y2="10" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Centro -->
  <circle cx="16" cy="16" r="1.5" fill="#534AB7"/>
</svg>
